# Blast Radius: four agents, four rooms, one group with "depends on" links.
# Generated by scripts/build_template.py from switch/rooms and switch/roles.
# Load it in Switch Console: Templates, Import template. Before running, publish
# the demo repos (make seed) so each agent can clone its repo.
version: 2

params:
  gh_user:
    type: string
    description: GitHub owner of the four demo repos
    default: ayushgawai
  teammate:
    type: string
    description: Your teammate's username on the messaging app (owns the dbt and ML repos)
  machine:
    type: machine
    description: The machine the agents run on
    default: [$first]
    input: advanced

resources:
  blast_radius:
    type: group
    name: blast-radius
    description: Schema changes and the team rooms that depend on them
    links:
      - {from: schema_changes, to: analytics, label: depends on}
      - {from: schema_changes, to: ml_features, label: depends on}
      - {from: schema_changes, to: dashboards, label: depends on}
  coordinator:
    type: agent
    name: br-coordinator
    display_name: Impact coordinator
    description: "Coordinates the blast radius of one upstream change"
    provider: claude
    machine: "{machine}"
    directory: "{$agents_dir}/br-coordinator"
    repo: "https://github.com/{gh_user}/br-events-producer"
    auto_approve: true
    connections: [atlassian]
    addressing: owner-agents
    instructions: |
      You are Impact coordinator. Your working directory is a clone of {gh_user}/br-events-producer.
      Follow the instructions of the role you hold and of the room you are addressed in.
  dbt:
    type: agent
    name: br-dbt
    display_name: dbt bot
    description: "Speaks for br-analytics-dbt (owner: teammate)"
    provider: claude
    machine: "{machine}"
    directory: "{$agents_dir}/br-dbt"
    repo: "https://github.com/{gh_user}/br-analytics-dbt"
    auto_approve: true
    connections: [atlassian]
    addressing: {anyone_in: [schema_changes, analytics]}
    instructions: |
      You are dbt bot. Your working directory is a clone of {gh_user}/br-analytics-dbt.
      Follow the instructions of the role you hold and of the room you are addressed in.
  ml:
    type: agent
    name: br-ml
    display_name: ML bot
    description: "Speaks for br-ml-features (owner: teammate)"
    provider: codex
    machine: "{machine}"
    directory: "{$agents_dir}/br-ml"
    repo: "https://github.com/{gh_user}/br-ml-features"
    auto_approve: true
    connections: [atlassian]
    addressing: {anyone_in: [schema_changes, ml_features]}
    instructions: |
      You are ML bot. Your working directory is a clone of {gh_user}/br-ml-features.
      Follow the instructions of the role you hold and of the room you are addressed in.
  dash:
    type: agent
    name: br-dash
    display_name: Dashboards bot
    description: "Speaks for br-dashboards-sql (owner: you)"
    provider: opencode
    machine: "{machine}"
    directory: "{$agents_dir}/br-dash"
    repo: "https://github.com/{gh_user}/br-dashboards-sql"
    auto_approve: true
    connections: [atlassian]
    addressing: owner-agents
    instructions: |
      You are Dashboards bot. Your working directory is a clone of {gh_user}/br-dashboards-sql.
      Follow the instructions of the role you hold and of the room you are addressed in.
  schema_changes:
    type: room
    group: blast_radius
    name: schema-changes
    description: Upstream schema and API changes, reviewed by every team that depends on them
    agents: [coordinator, dbt, ml, dash]
    users: ["{$creator}", "{teammate}"]
    aliases: {coordinator: coordinator, dbt: dbt-bot, ml: ml-bot, dash: dash-bot}
    instructions: |
      This room reviews schema and API changes before they merge. When someone announces a change with a PR link, the impact-coordinator restates it in one line and addresses @impact-checker. Each impact-checker tests the change in its own repo and replies in the same thread with: repo, files affected, the exact failing command and its output (trimmed to the error lines), the Jira ticket, and a one line fix plan. If nothing breaks, say "no impact" with the command you ran. Keep replies short. Never claim a test passed or failed without running it.
    roles:
      - name: impact-coordinator
        exclusive: true
        instructions: |
          You own one upstream change at a time. The upstream repo is ayushgawai/br-events-producer, owned by Ayush; your working directory is a clone of it. Jira project BR on ayushsunilgawai.atlassian.net (if the key is still KAN, use KAN).

          On a change announcement with a PR link:
          1. Read the PR with `gh pr view <n> --repo ayushgawai/br-events-producer --json number,title,headRefName,headRefOid,files` and restate it in one line with the PR link.
          2. List the linked rooms that depend on this one.
          3. Address @impact-checker: "please test against branch <headRefName> and report here".
          4. Create the Jira parent issue "Blast radius: <PR title> (#<n>)", assigned to Ayush, and set a pending commit status on the PR head:
             `gh api repos/ayushgawai/br-events-producer/statuses/<headRefOid> -f state=pending -f context=blast-radius -f description="Waiting on owners"`
          5. As reports arrive, write the room document impact-<n> with one row per breakage: repo, file, failing check, owner, Jira ticket, fix PR, status. Once all three checkers have reported, post one summary: "Impact report for PR #<n>: <k> breakages in <m> repos, <f> fix PRs open. Document: impact-<n>. Waiting on approvals from <owners>." and update the status description to "Waiting on <N> owners".
          6. As each checker reports an owner approval, update the document. When every affected owner has approved: set the status to success with description "<k> breakages fixed across <m> repos", move the Jira parent to Done, and post "PR #<n> cleared: <k> breakages fixed across <m> repos. All owners approved. Report: impact-<n>."

          If every checker reports no impact, set the status to success with "No downstream impact" and say so in one line. Never run downstream tests yourself; the checkers do.
      - name: impact-checker
        exclusive: false
        instructions: |
          You speak for one downstream repo: the git clone in your working directory. Its README names the owner. Jira project BR on ayushsunilgawai.atlassian.net (if the key is still KAN, use KAN).

          On a change from the coordinator:
          1. `git checkout main && git pull -q`, then `UPSTREAM_REF=<upstream branch> make test`.
          2. Reply in the same thread: repo, number of failures, the failing models or tests, the error lines (trimmed), and a one line fix plan. If everything passes, reply "no impact" with the command you ran, and stop.
          3. If anything fails: create a Jira issue in BR "<repo>: adapt to <change>", assigned to the repo owner, linked to the coordinator's parent issue, listing the failing checks.
          4. Create branch fix/<upstream PR number>. Make the smallest fix. Set the file upstream.ref to the upstream branch. Run `UPSTREAM_REF=<upstream branch> make test` until it passes.
          5. Commit, push, and open a PR titled "[<JIRA-KEY>] Adapt to account_id rename (blast radius of ayushgawai/br-events-producer#<n>)" whose body links the Jira issue and the upstream PR.
          6. Post the PR link and Jira key in your team room for the owner, as the team room instructions say, and tell the coordinator in this thread.

          Never merge. Never claim a result you did not run.
    references:
      - value:
          - type: github
            name: br-events-producer
            description: "The upstream repo whose changes this room reviews"
            instructions: Use gh and git. Run make test with UPSTREAM_REF set to the upstream branch under review.
            value: {urls: ["https://github.com/{gh_user}/br-events-producer"]}
          - type: jira
            name: Jira BR
            description: Tickets for every breakage, assigned to the repo owner
            instructions: Use the Atlassian connection. Project key BR.
            value: {urls: ["https://ayushsunilgawai.atlassian.net/browse/BR"]}
    kickoff: |
      @coordinator assume the impact-coordinator role. @dbt-bot @ml-bot @dash-bot assume the impact-checker role. Then each say in one line which repo you speak for.
  analytics:
    type: room
    group: blast_radius
    name: analytics
    description: "Team room for br-analytics-dbt"
    agents: [dbt]
    users: ["{$creator}", "{teammate}"]
    aliases: {dbt: dbt-bot}
    instructions: |
      This is the team room for one downstream repo. When a fix is needed, the team's agent opens a fix PR, posts the PR link and its Jira ticket here with a two line summary, and waits for the repo owner to approve in this room. Only the repo owner's approval counts; if anyone else approves, say it needs the owner. Do not merge anything. After approval, comment "approved by <owner name from the README> in Switch" on the PR and the Jira ticket, move the ticket to Done, and report back to @coordinator in #schema-changes.
    references:
      - value:
          - type: github
            name: br-analytics-dbt
            description: "Team room for br-analytics-dbt"
            instructions: Use gh and git. Run make test with UPSTREAM_REF set to the upstream branch under review.
            value: {urls: ["https://github.com/{gh_user}/br-analytics-dbt"]}
  ml_features:
    type: room
    group: blast_radius
    name: ml-features
    description: "Team room for br-ml-features"
    agents: [ml]
    users: ["{$creator}", "{teammate}"]
    aliases: {ml: ml-bot}
    instructions: |
      This is the team room for one downstream repo. When a fix is needed, the team's agent opens a fix PR, posts the PR link and its Jira ticket here with a two line summary, and waits for the repo owner to approve in this room. Only the repo owner's approval counts; if anyone else approves, say it needs the owner. Do not merge anything. After approval, comment "approved by <owner name from the README> in Switch" on the PR and the Jira ticket, move the ticket to Done, and report back to @coordinator in #schema-changes.
    references:
      - value:
          - type: github
            name: br-ml-features
            description: "Team room for br-ml-features"
            instructions: Use gh and git. Run make test with UPSTREAM_REF set to the upstream branch under review.
            value: {urls: ["https://github.com/{gh_user}/br-ml-features"]}
  dashboards:
    type: room
    group: blast_radius
    name: dashboards
    description: "Team room for br-dashboards-sql"
    agents: [dash]
    users: ["{$creator}", "{teammate}"]
    aliases: {dash: dash-bot}
    instructions: |
      This is the team room for one downstream repo. When a fix is needed, the team's agent opens a fix PR, posts the PR link and its Jira ticket here with a two line summary, and waits for the repo owner to approve in this room. Only the repo owner's approval counts; if anyone else approves, say it needs the owner. Do not merge anything. After approval, comment "approved by <owner name from the README> in Switch" on the PR and the Jira ticket, move the ticket to Done, and report back to @coordinator in #schema-changes.
    references:
      - value:
          - type: github
            name: br-dashboards-sql
            description: "Team room for br-dashboards-sql"
            instructions: Use gh and git. Run make test with UPSTREAM_REF set to the upstream branch under review.
            value: {urls: ["https://github.com/{gh_user}/br-dashboards-sql"]}
